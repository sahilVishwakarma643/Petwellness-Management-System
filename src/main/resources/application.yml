server:
  port: 8080
  tomcat:
    max-part-count: 50
spring:
  config:
    import: optional:file:./secrets.properties
  application:
    name: petwellnessdb
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/petwellnessdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 35MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
file:
  upload-dir: ${user.home}/petwellness/uploads

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  api-base: ${RAZORPAY_API_BASE:https://api.razorpay.com/v1}
  reconcile:
    enabled: ${RAZORPAY_RECONCILE_ENABLED:false}
    delay-ms: ${RAZORPAY_RECONCILE_DELAY_MS:600000}
    batch-size: ${RAZORPAY_RECONCILE_BATCH_SIZE:10}
    min-age-minutes: ${RAZORPAY_RECONCILE_MIN_AGE_MINUTES:10}

appointments:
  slot-cleanup:
    delay-ms: ${APPOINTMENTS_SLOT_CLEANUP_DELAY_MS:10800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web: {}

otp:
  expiry-minutes: 5
  max-failed-attempts: 5

  rate-limit:
    cooldown:
      capacity: 1
      refill-tokens: 1
      duration-seconds: 60

    window:
      capacity: 5
      refill-tokens: 5
      duration-minutes: 15

info:
  app:
    name: Petwellness and Management System
    version: 1.0.0
    description: Backend APIs for pet management and healthcare

